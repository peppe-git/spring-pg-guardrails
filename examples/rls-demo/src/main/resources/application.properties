spring.application.name=rls-demo
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway placeholders for the RLS helpers migration (the library's template, copied as V1).
spring.flyway.placeholders.rls_schema=rls
spring.flyway.placeholders.tenant_guc=app.current_tenant
spring.flyway.placeholders.strict_guc=app.rls_strict
spring.flyway.placeholders.admin_read_guc=app.rls_admin_read

# The application connects as a role subject to RLS; refuse to start otherwise.
pg-rls.runtime-role-check=fail
