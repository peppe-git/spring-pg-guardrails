# Weekly updates, grouped so that a normal week opens at most a few pull requests.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - org.springframework.boot:*
      maven-plugins:
        patterns:
          - org.apache.maven.plugins:*
          - org.sonatype.central:*
      other-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
