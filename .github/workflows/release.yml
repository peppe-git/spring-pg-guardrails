# SPDX-License-Identifier: Apache-2.0
# Publishes a release to Maven Central when a tag v* is pushed (or when run by hand on such a tag).
# The deployment is uploaded with autoPublish=false: it waits in the Central Portal until a maintainer publishes it.
# Third-party actions are pinned by commit SHA; the comment names the release it corresponds to.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the version matches the tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::run this workflow on a tag v<version>, not on $GITHUB_REF"
            exit 1
          fi
          version="$(python3 -c 'import xml.etree.ElementTree as E; ns={"m": "http://maven.apache.org/POM/4.0.0"}; print(E.parse("pom.xml").getroot().find("m:version", ns).text.strip())')"
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::the POM version is $version: a release cannot be a SNAPSHOT"
            exit 1
          fi
          if [[ "v$version" != "$tag" ]]; then
            echo "::error::the POM version is $version but the tag is $tag"
            exit 1
          fi
          echo "Releasing $version"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD

      - name: Build, test, sign and upload to the Central Portal
        run: ./mvnw -B -ntp -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # Bouncy Castle signer of maven-gpg-plugin: armored secret key and its passphrase.
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
